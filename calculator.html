<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car Installments Calculator</title>
  </head>
  <body>
    <div id="inputs">
      <label for="type">Car Type</label>
      <select name="car type" id="type">
        <option value="#"></option>
        <option value="BMW">BMW</option>
        <option value="Mercedes">Mercedes</option>
        <option value="Toyota">Toyota</option>
        <option value="Hyundai">Hyundai</option>
      </select>
      <label for="model">Car Model</label>
      <input type="text" id="model" name="car model" />

      <label for="price">Car Price</label>
      <input type="number" id="price" name="car price" />

      <label for="Down Payment">Down Payment</label>
      <input type="number" id="Down Payment" name="Down Payment" />

      <label for="Installment Duration">Installment Duration</label>
      <select name="Installment Duration" id="Installment Duration">
        <option value="#"></option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
      </select>
    </div>
    <h1 id="interestValue">Interest Rate</h1>
    <h1 id="monthlyInstallment">Monthly Installment</h1>
  </body>
</html>
